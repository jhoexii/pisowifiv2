flush ruleset

table inet pisowifi {
  set authorized_clients {
    type ipv4_addr
    flags interval
  }

  chain input {
    type filter hook input priority 0; policy accept;
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    iifname "wlan0" oifname "eth0" ip saddr @authorized_clients accept
    iifname "eth0" oifname "wlan0" ct state established,related accept
  }

  chain prerouting {
    type nat hook prerouting priority -100; policy accept;
    iifname "wlan0" tcp dport 80 ip saddr != @authorized_clients redirect to :8080
  }

  chain postrouting {
    type nat hook postrouting priority 100; policy accept;
    oifname "eth0" ip saddr 10.10.0.0/24 masquerade
  }
}
