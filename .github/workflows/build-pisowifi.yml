name: Build PisoWiFi Orange Pi Zero 3

on:
  workflow_dispatch:
    inputs:
      ssid:
        description: "Wi-Fi SSID"
        required: true
        default: "PisoWiFi"
        type: string

      wifi_password:
        description: "Wi-Fi password (8+ characters)"
        required: true
        type: string

      admin_password:
        description: "PisoWiFi admin password"
        required: true
        type: string

      gpio_line:
        description: "Linux GPIO line for coin input"
        required: true
        default: "6"
        type: string

      gpio_chip:
        description: "GPIO chip device"
        required: true
        default: "/dev/gpiochip0"
        type: string

      wifi_interface:
        description: "Wi-Fi interface"
        required: true
        default: "wlan0"
        type: string

      wan_interface:
        description: "Internet/WAN interface"
        required: true
        default: "eth0"
        type: string

# We only download source and upload an Actions artifact.
# No GitHub Release is required.
permissions:
  contents: read

jobs:

  build:

    name: Build PisoWiFi Image

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    steps:

      # ------------------------------------------------------------
      # Checkout your PisoWiFi repository
      # ------------------------------------------------------------

      - name: Checkout PisoWiFi project
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # Free disk space
      # ------------------------------------------------------------

      - name: Free runner disk space
        uses: descriptinc/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true


      # ------------------------------------------------------------
      # Check project
      # ------------------------------------------------------------

      - name: Check project structure
        shell: bash
        run: |

          set -euo pipefail

          echo "======================================"
          echo "PisoWiFi repository"
          echo "======================================"

          pwd

          echo
          echo "Top level:"
          ls -la

          echo
          echo "userpatches:"
          if [ -d userpatches ]; then
              find userpatches -maxdepth 5 -type f -print | sort
          else
              echo "ERROR: userpatches directory not found"
              exit 1
          fi


      # ------------------------------------------------------------
      # Create PisoWiFi configuration
      # ------------------------------------------------------------

      - name: Create PisoWiFi build configuration
        shell: bash

        env:
          WIFI_PASSWORD: ${{ inputs.wifi_password }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
          WIFI_SSID: ${{ inputs.ssid }}
          GPIO_LINE: ${{ inputs.gpio_line }}
          GPIO_CHIP: ${{ inputs.gpio_chip }}
          WIFI_INTERFACE: ${{ inputs.wifi_interface }}
          WAN_INTERFACE: ${{ inputs.wan_interface }}

        run: |

          set -euo pipefail

          mkdir -p \
            userpatches/overlay/etc/pisowifi

          mkdir -p userpatches/overlay/etc/pisowifi && printf 'PISOWIFI_SSID=%s\nPISOWIFI_WIFI_PASSWORD=%s\nPISOWIFI_ADMIN_PASSWORD=%s\nPISOWIFI_GPIO_CHIP=%s\nPISOWIFI_GPIO_LINE=%s\nPISOWIFI_WIFI_INTERFACE=%s\nPISOWIFI_WAN_INTERFACE=%s\n' "$WIFI_SSID" "$WIFI_PASSWORD" "$ADMIN_PASSWORD" "$GPIO_CHIP" "$GPIO_LINE" "$WIFI_INTERFACE" "$WAN_INTERFACE" > userpatches/overlay/etc/pisowifi/build.env && chmod 600 userpatches/overlay/etc/pisowifi/build.env

          chmod 600 \
            userpatches/overlay/etc/pisowifi/build.env

          echo
          echo "PisoWiFi configuration created."

          echo "SSID: ${WIFI_SSID}"
          echo "WiFi interface: ${WIFI_INTERFACE}"
          echo "WAN interface: ${WAN_INTERFACE}"
          echo "GPIO chip: ${GPIO_CHIP}"
          echo "GPIO line: ${GPIO_LINE}"


      # ------------------------------------------------------------
      # Download Armbian build framework
      # ------------------------------------------------------------

      - name: Checkout Armbian build framework
        uses: actions/checkout@v4

        with:
          repository: armbian/build
          ref: main
          path: armbian-build
          fetch-depth: 1


      # ------------------------------------------------------------
      # Copy PisoWiFi userpatches into Armbian
      # ------------------------------------------------------------

      - name: Install PisoWiFi userpatches
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p armbian-build/userpatches

          if [ -d userpatches ]; then

            cp -a \
              userpatches/. \
              armbian-build/userpatches/

          fi

          echo
          echo "======================================"
          echo "Armbian userpatches"
          echo "======================================"

          find armbian-build/userpatches \
            -maxdepth 6 \
            -type f \
            -print \
            | sort


      # ------------------------------------------------------------
      # Install Armbian host requirements
      # ------------------------------------------------------------

      - name: Install Armbian requirements
        shell: bash
        working-directory: armbian-build
        run: |

          set -euo pipefail

          echo "Installing Armbian build requirements..."

          sudo ./compile.sh requirements


      # ------------------------------------------------------------
      # Build Orange Pi Zero 3
      # ------------------------------------------------------------

      - name: Build Orange Pi Zero 3
        shell: bash
        working-directory: armbian-build

        run: |

          set -euo pipefail

          echo
          echo "======================================"
          echo "Building Orange Pi Zero 3"
          echo "======================================"

          ./compile.sh build \
            BOARD=orangepizero3 \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz \
            SHARE_LOG=yes


      # ------------------------------------------------------------
      # Find generated image
      # ------------------------------------------------------------

      - name: Show generated images
        shell: bash
        working-directory: armbian-build

        run: |

          set -euo pipefail

          echo
          echo "======================================"
          echo "Generated images"
          echo "======================================"

          if [ ! -d output/images ]; then

            echo "ERROR:"
            echo "output/images does not exist."

            echo
            echo "Searching entire build directory..."

            find . \
              -type f \
              \( \
                -name "*.img" \
                -o -name "*.img.xz" \
                -o -name "*.img.sha" \
              \) \
              -print

            exit 1

          fi

          find output/images \
            -maxdepth 1 \
            -type f \
            -printf "%f %s bytes\n" \
            | sort


      # ------------------------------------------------------------
      # Upload final SD card image
      # ------------------------------------------------------------

      - name: Upload PisoWiFi image
        uses: actions/upload-artifact@v4

        with:
          name: pisowifi-orangepi-zero3-image

          path: |
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/*.img.xz.sha
            armbian-build/output/images/*.img.xz.asc

          if-no-files-found: error

          retention-days: 14


      # ------------------------------------------------------------
      # Upload build logs
      # ------------------------------------------------------------

      - name: Upload build logs
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: pisowifi-build-logs

          path: |
            armbian-build/output/logs/**

          if-no-files-found: ignore

          retention-days: 7
