name: Build PisoWiFi Orange Pi Zero 3

on:
  workflow_dispatch:
    inputs:
      ssid:
        description: "PisoWiFi SSID"
        required: true
        default: "PisoWiFi"

      wifi_password:
        description: "WiFi password"
        required: true

      admin_password:
        description: "PisoWiFi admin password"
        required: true

      gpio_line:
        description: "GPIO line number"
        required: true
        default: "6"

      gpio_chip:
        description: "GPIO chip"
        required: true
        default: "/dev/gpiochip0"

      wifi_interface:
        description: "WiFi interface"
        required: true
        default: "wlan0"

      wan_interface:
        description: "WAN interface"
        required: true
        default: "eth0"

permissions:
  contents: read

jobs:
  build:
    name: Build Orange Pi Zero 3
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout PisoWiFi project
      # ---------------------------------------------------------
      - name: Checkout PisoWiFi project
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Free disk space on GitHub runner
      # ---------------------------------------------------------
      - name: Free disk space
        uses: descriptinc/free-disk-space@main

      # ---------------------------------------------------------
      # Create PisoWiFi configuration
      # ---------------------------------------------------------
      - name: Create PisoWiFi configuration
        env:
          WIFI_SSID: ${{ inputs.ssid }}
          WIFI_PASSWORD: ${{ inputs.wifi_password }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
          GPIO_CHIP: ${{ inputs.gpio_chip }}
          GPIO_LINE: ${{ inputs.gpio_line }}
          WIFI_INTERFACE: ${{ inputs.wifi_interface }}
          WAN_INTERFACE: ${{ inputs.wan_interface }}

        run: |
          mkdir -p userpatches/overlay/etc/pisowifi && printf 'PISOWIFI_SSID=%s\nPISOWIFI_WIFI_PASSWORD=%s\nPISOWIFI_ADMIN_PASSWORD=%s\nPISOWIFI_GPIO_CHIP=%s\nPISOWIFI_GPIO_LINE=%s\nPISOWIFI_WIFI_INTERFACE=%s\nPISOWIFI_WAN_INTERFACE=%s\n' "$WIFI_SSID" "$WIFI_PASSWORD" "$ADMIN_PASSWORD" "$GPIO_CHIP" "$GPIO_LINE" "$WIFI_INTERFACE" "$WAN_INTERFACE" > userpatches/overlay/etc/pisowifi/build.env && chmod 600 userpatches/overlay/etc/pisowifi/build.env

          echo "PisoWiFi configuration created."

      # ---------------------------------------------------------
      # Check PisoWiFi files
      # ---------------------------------------------------------
      - name: Check PisoWiFi project
        run: |
          echo "===== Repository ====="
          ls -la

          echo
          echo "===== userpatches ====="
          find userpatches -maxdepth 4 -type f -print 2>/dev/null || true

          echo
          echo "===== PisoWiFi configuration ====="
          ls -l userpatches/overlay/etc/pisowifi/ 2>/dev/null || true

      # ---------------------------------------------------------
      # Checkout Armbian build framework
      # ---------------------------------------------------------
      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: main
          path: armbian-build

      # ---------------------------------------------------------
      # Copy PisoWiFi userpatches into Armbian
      # ---------------------------------------------------------
      - name: Install PisoWiFi userpatches
        run: |
          rm -rf armbian-build/userpatches
          cp -a userpatches armbian-build/userpatches

          echo "===== Armbian userpatches ====="
          find armbian-build/userpatches -maxdepth 5 -type f -print

      # ---------------------------------------------------------
      # Fix permissions
      # ---------------------------------------------------------
      - name: Fix Armbian build permissions
        run: |
          sudo chown -R "$USER:$USER" armbian-build

          mkdir -p armbian-build/.tmp
          chmod -R u+rwX armbian-build

          echo "Permissions fixed."

      # ---------------------------------------------------------
      # Show build environment
      # ---------------------------------------------------------
      - name: Show build environment
        run: |
          cd armbian-build

          echo "===== Bash ====="
          bash --version | head -n 1

          echo
          echo "===== Docker ====="
          docker --version

          echo
          echo "===== Armbian version ====="
          git rev-parse --short HEAD

          echo
          echo "===== Disk space ====="
          df -h

      # ---------------------------------------------------------
      # Build Armbian image
      # ---------------------------------------------------------
      - name: Build Orange Pi Zero 3
        run: |
          cd armbian-build

          ./compile.sh build \
            BOARD=orangepizero3 \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz \
            SHARE_LOG=yes

      # ---------------------------------------------------------
      # Show generated files
      # ---------------------------------------------------------
      - name: Show build output
        if: always()
        run: |
          echo "===== Output directory ====="

          if [ -d armbian-build/output/images ]; then
            ls -lah armbian-build/output/images
          else
            echo "No output/images directory found."
          fi

          echo
          echo "===== Build logs ====="

          if [ -d armbian-build/output/logs ]; then
            find armbian-build/output/logs -maxdepth 2 -type f -print
          else
            echo "No output/logs directory found."
          fi

      # ---------------------------------------------------------
      # Upload generated image
      # ---------------------------------------------------------
      - name: Upload PisoWiFi image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pisowifi-orange-pi-zero3-image
          path: |
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/*.img.xz.sha
            armbian-build/output/images/*.img.xz.asc
          if-no-files-found: warn
          retention-days: 7

      # ---------------------------------------------------------
      # Upload build logs
      # ---------------------------------------------------------
      - name: Upload Armbian build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pisowifi-armbian-build-logs
          path: |
            armbian-build/output/logs/**
            armbian-build/output/debug/**
          if-no-files-found: warn
          retention-days: 7
